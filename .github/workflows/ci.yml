name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # Explicit toolchain (must match rust-toolchain.toml). The action
      # does not read rust-toolchain.toml itself, so pin it here.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Show pinned toolchain
        run: rustc --version
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --locked --all-features
      - name: Tests (no default features)
        run: cargo test --locked --no-default-features
      - name: References (strict release mode: pending fails)
        run: cargo test --locked --test reference
        env:
          SUBRASS_STRICT_REFERENCES: "1"
      - name: WASM test target compiles
        run: cargo check --target wasm32-unknown-unknown --tests --locked

  wasm-tests:
    name: Browser tests (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Run wasm-bindgen tests in headless Chrome
        run: wasm-pack test --headless --chrome

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit (fails on unacknowledged advisories)
        run: cargo audit --deny warnings

  fuzz-smoke:
    name: Fuzz smoke (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-09-17
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Build fuzz targets
        run: cd fuzz && cargo fuzz build
      - name: Smoke each target briefly
        run: |
          cd fuzz
          for target in parse_ass drawing render; do
            cargo fuzz run "$target" -- -runs=10000 -max_total_time=20
          done

  demo:
    name: Demo typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build WASM package (demo imports pkg/)
        run: wasm-pack build --target web --out-dir pkg
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Bun tests
        run: bun test
